<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />

  <!-- Outer Protective Halo -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8" />

  <!-- Shield Shape -->
  <path d="M 256 70 
           L 380 125 
           C 380 260 330 380 256 430 
           C 182 380 132 260 132 125 
           Z" 
        fill="url(#shieldGrad)" 
        fill-opacity="0.15" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Internal Shield Border Accent -->
  <path d="M 256 95 
           L 355 140 
           C 355 245 315 348 256 392 
           C 197 348 157 245 157 140 
           Z" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="3" 
        stroke-opacity="0.6" />

  <!-- Calendar Grid with Security Checkmark -->
  <g transform="translate(196, 175)">
    <!-- Calendar Body -->
    <rect x="0" y="20" width="120" height="110" rx="16" fill="#0f172a" stroke="#6366f1" stroke-width="6" />
    <!-- Calendar Header -->
    <path d="M 0 36 C 0 25 9 20 20 20 L 100 20 C 111 20 120 25 120 36 L 120 48 L 0 48 Z" fill="#6366f1" />
    <!-- Rings -->
    <rect x="25" y="8" width="10" height="22" rx="5" fill="#38bdf8" />
    <rect x="85" y="8" width="10" height="22" rx="5" fill="#38bdf8" />
    <!-- AI Core Sparkle inside calendar -->
    <circle cx="60" cy="82" r="14" fill="#10b981" />
    <path d="M 60 70 L 60 94 M 48 82 L 72 82" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Cyber Verification Lock Node -->
  <circle cx="256" cy="330" r="18" fill="#10b981" stroke="#34d399" stroke-width="4" />
  <path d="M 251 330 L 254 334 L 262 325" fill="none" stroke="#042f2e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
