    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      (function() {
        // AI Studio environment constraint: "HMR: Disabled. Ignore WebSocket errors."
        // Suppress console.error logging from Vite client for WebSocket disconnection
        const origConsoleError = console.error;
        console.error = function(...args) {
          const text = args.map(a => {
            if (typeof a === 'string') return a;
            if (a && a.message) return a.message;
            if (a && a.stack) return a.stack;
            return '';
          }).join(' ');

          if (text.includes('WebSocket') && (text.includes('closed without opened') || text.includes('[vite]') || text.includes('failed'))) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        // Gracefully mock Vite HMR WebSocket connection so @vite/client never fires error/closed events
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            const isViteHmr = (typeof protocols === 'string' && protocols.includes('vite-hmr')) ||
                              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
                              (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite/client')));
            if (isViteHmr) {
              const listeners = {};
              const mockSocket = {
                url: String(url),
                readyState: 1, // WebSocket.OPEN
                protocol: 'vite-hmr',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(listener);
                  if (type === 'open') {
                    setTimeout(() => {
                      try {
                        if (typeof listener === 'function') {
                          listener.call(mockSocket, new Event('open'));
                        } else if (listener && typeof listener.handleEvent === 'function') {
                          listener.handleEvent(new Event('open'));
                        }
                      } catch (err) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, listener) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(l => l !== listener);
                  }
                },
                dispatchEvent: function() { return false; },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
              };
              setTimeout(() => {
                if (typeof mockSocket.onopen === 'function') {
                  try { mockSocket.onopen(new Event('open')); } catch (err) {}
                }
              }, 0);
              return mockSocket;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('error', function(e) {
          const msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (msg.includes('WebSocket') || msg.includes('vite')) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          const msg = (e && e.reason && (e.reason.message || String(e.reason))) || '';
          if (msg.includes('WebSocket') || msg.includes('vite')) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
